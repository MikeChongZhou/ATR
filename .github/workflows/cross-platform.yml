name: Cross-platform checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -v
      - if: runner.os == 'macOS'
        run: python packaging/build_macos.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./build_exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ATR-${{ runner.os }}
          path: ${{ runner.os == 'macOS' && 'dist/ATR-macOS.zip' || 'dist/' }}
